aid: elixir-medical
name: Elixir Medical
description: 'Elixir Medical Corporation is a privately held medical device company
  headquartered in Milpitas, California, developing implant and interventional platforms
  for coronary and peripheral artery disease. Its DynamX sirolimus-eluting coronary
  bioadaptor is designed to restore vessel pulsatility and compliance rather than permanently
  cage the artery, and holds a European CE mark, Japanese PMDA approval and a U.S. FDA
  Breakthrough Device designation; the LithiX Hertz Contact intravascular lithotripsy
  system and the DESyne family of drug-eluting stents round out the portfolio. Elixir
  Medical operates no developer program and publishes no product, device or clinical
  API. The only machine-readable surface it serves is the default WordPress REST API
  of its corporate marketing site, alongside an SEO-plugin-generated llms.txt.'
