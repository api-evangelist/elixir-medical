apis:
- aid: elixir-medical-wordpress-content
  name: Elixir Medical Website Content API (WordPress REST)
  description: 'The WordPress core REST API (wp/v2 namespace) served by elixirmedical.com,
    the Elixir Medical corporate website. It exposes the site''s pages, news posts,
    media library, categories, tags, comments, authors, site custom post types and
    a search endpoint. Read operations on the content collections were observed to
    answer anonymously with RFC-5988 pagination links and X-WP-Total / X-WP-TotalPages
    headers; write operations require WordPress application-password authentication.
    This is a content-management surface incidental to the marketing site, not a product,
    device or clinical API — Elixir Medical does not advertise, document or support
    it, and the OpenAPI in this repository was derived by API Evangelist from the route
    descriptor the site itself publishes, not by the provider.'
